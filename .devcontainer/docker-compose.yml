# Development only. Used by GitHub Codespaces or VS Code Dev Containers so nothing is installed on your PC.
services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-22.04
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    command: sleep infinity
    network_mode: service:db
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-only-root}
      MYSQL_DATABASE: freelance_pricing
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
